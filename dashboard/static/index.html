<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Motus bot — dashboard</title>
<style>
  :root {
    --bg: #0f1720;
    --panel: #17222d;
    --border: #2a3a48;
    --text: #e6edf3;
    --muted: #8b98a5;
    --absent: #3a4753;
    --present: #b58900;
    --correct: #2e7d32;
    --accent: #3b82f6;
    --error: #d64545;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 16px;
  }
  header h1 { font-size: 16px; margin: 0; flex: 0 0 auto; }
  .status-pill {
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    background: var(--absent);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .status-pill[data-status="running"] { background: var(--accent); }
  .status-pill[data-status="solved"], .status-pill[data-status="idle"] { background: var(--correct); }
  .status-pill[data-status="error"], .status-pill[data-status="throttled"] { background: var(--error); }
  .status-pill[data-status="daily_limit"] { background: var(--present); }
  select {
    background: #10181f; color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 6px; font-size: 12px;
  }
  .game-line { font-size: 12px; color: var(--muted); }
  .game-line b { color: var(--text); }
  .auth-pill { font-size: 12px; color: var(--muted); margin-left: auto; }
  button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(260px, 380px) 1fr;
    grid-template-rows: minmax(0, 1fr) minmax(160px, 260px);
    gap: 16px;
    padding: 16px 20px;
    overflow: hidden;
  }
  main > section.stats { grid-column: 1 / -1; }
  .config-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; }
  .config-row label { flex: 0 0 90px; color: var(--muted); }
  .config-row input[type="number"] {
    width: 70px; background: #10181f; color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 3px 6px; font-size: 12px;
  }
  .config-hint { font-size: 11px; color: var(--muted); margin: 4px 0 12px; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--text); }
  .stats-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .stats-tabs button { padding: 3px 10px; font-size: 11px; }
  .stats-tabs button[data-active="true"] { border-color: var(--accent); color: var(--accent); }
  .stats-pane { display: none; }
  .stats-pane[data-active="true"] { display: block; }
  section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    overflow: auto;
  }
  section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 10px; }
  #board { display: flex; flex-direction: column; gap: 4px; align-items: center; margin-bottom: 20px; }
  .row { display: flex; gap: 4px; }
  .cell {
    width: 34px; height: 34px;
    border: 1px solid var(--border);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px;
    background: #10181f;
  }
  .cell[data-state="0"] { background: var(--absent); }
  .cell[data-state="1"] { background: var(--present); }
  .cell[data-state="2"] { background: var(--correct); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; }
  #events { display: flex; flex-direction: column-reverse; gap: 4px; font-size: 12px; font-family: ui-monospace, monospace; }
  .event { padding: 4px 6px; border-radius: 4px; background: #10181f; }
  .event .t { color: var(--muted); margin-right: 6px; }
  .event.rejected { color: #f0b429; }
  .event.solved { color: #4ade80; }
  .event.error { color: var(--error); }
</style>
</head>
<body>
<header>
  <h1>Motus bot — dashboard</h1>
  <span id="status" class="status-pill" data-status="idle">idle</span>
  <label for="modeSelect" style="font-size:12px;color:var(--muted);">mode</label>
  <select id="modeSelect">
    <option value="infinite">Infini</option>
    <option value="daily">Quotidien (1 partie / jour)</option>
    <option value="ranked" disabled title="Duels contre de vrais joueurs : non automatisé">Classé (non automatisé)</option>
  </select>
  <label for="strategySelect" style="font-size:12px;color:var(--muted);">stratégie</label>
  <select id="strategySelect">
    <option value="entropy_pure">entropy_pure (défaut)</option>
    <option value="composite">composite</option>
  </select>
  <label for="iterationsInput" style="font-size:12px;color:var(--muted);">parties</label>
  <input type="number" id="iterationsInput" min="1" max="100000" value="1" style="width:70px;background:#10181f;color:var(--text);border:1px solid var(--border);border-radius:4px;padding:4px 6px;font-size:12px;" />
  <button id="startBtn">Démarrer</button>
  <button id="stopBtn" disabled>Arrêter</button>
  <span id="loopProgress" class="auth-pill" style="margin-left:0;"></span>
  <span id="gameLine" class="game-line"></span>
  <span id="authPill" class="auth-pill">session : —</span>
</header>
<main>
  <section>
    <h2>Plateau</h2>
    <div id="board"></div>
    <h2>Latence par étape (dernier coup)</h2>
    <table id="latencyTable">
      <thead><tr><th>étape</th><th>durée (s)</th></tr></thead>
      <tbody></tbody>
    </table>
    <h2>Délai de saisie</h2>
    <div class="config-row">
      <label for="letterDelayMin">min (ms)</label>
      <input type="number" id="letterDelayMin" min="0" step="10" />
      <label for="letterDelayMax">max (ms)</label>
      <input type="number" id="letterDelayMax" min="0" step="10" />
      <button id="applyDelayBtn">Appliquer</button>
    </div>
    <div class="config-hint" id="delayHint">valeur actuelle : —</div>
  </section>
  <section>
    <h2>Événements</h2>
    <div id="events"></div>
  </section>
  <section class="stats">
    <h2>Statistiques (parties jouées, persistant entre sessions)</h2>
    <div class="config-row">
      <label for="statsModeSelect">mode</label>
      <select id="statsModeSelect">
        <option value="infinite">Infini</option>
        <option value="daily">Quotidien</option>
        <option value="all">Tous modes (conditions différentes)</option>
      </select>
      <span class="config-hint" id="statsModeHint" style="margin:0;"></span>
    </div>
    <div class="stats-tabs">
      <button data-tab="overall" data-active="true">Global</button>
      <button data-tab="by_length">Par longueur</button>
      <button data-tab="by_letter">Par lettre</button>
      <button data-tab="failed">Échecs</button>
      <button data-tab="solutions">Solutions</button>
    </div>
    <div class="stats-pane" data-pane="overall" data-active="true">
      <table id="overallStatsTable"><tbody></tbody></table>
    </div>
    <div class="stats-pane" data-pane="by_length">
      <table id="byLengthStatsTable"></table>
    </div>
    <div class="stats-pane" data-pane="by_letter">
      <table id="byLetterStatsTable"></table>
    </div>
    <div class="stats-pane" data-pane="failed">
      <table id="failedStatsTable"></table>
    </div>
    <div class="stats-pane" data-pane="solutions">
      <div class="config-hint" id="solutionsHint"></div>
      <h2 style="margin-top:10px;">Longueur des solutions</h2>
      <table id="solutionsByLengthTable"></table>
      <h2 style="margin-top:10px;">Lettre initiale des solutions</h2>
      <table id="solutionsByLetterTable"></table>
      <h2 style="margin-top:10px;">Solutions déjà vues plusieurs fois</h2>
      <table id="solutionsRepeatedTable"></table>
    </div>
  </section>
</main>
<script>
const boardEl = document.getElementById('board');
const eventsEl = document.getElementById('events');
const statusEl = document.getElementById('status');
const authPill = document.getElementById('authPill');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const loopProgress = document.getElementById('loopProgress');
const iterationsInput = document.getElementById('iterationsInput');
const latencyBody = document.querySelector('#latencyTable tbody');
const modeSelect = document.getElementById('modeSelect');
const strategySelect = document.getElementById('strategySelect');
const gameLine = document.getElementById('gameLine');
const statsModeSelect = document.getElementById('statsModeSelect');
const MODE_LABELS = { infinite: 'infini', daily: 'quotidien', ranked: 'classé' };

let wordLength = 0;
let rows = [];

function setStatus(status) {
  statusEl.textContent = status === 'daily_limit' ? 'quotidien déjà joué' : status;
  statusEl.dataset.status = status;
  startBtn.disabled = status === 'running';
  stopBtn.disabled = status !== 'running';
  modeSelect.disabled = strategySelect.disabled = status === 'running';
}

function renderGameLine(game, mode) {
  const m = MODE_LABELS[mode] || mode;
  if (!game) { gameLine.innerHTML = `mode actif : <b>${m}</b>`; return; }
  const word = game.letter ? `${game.letter}·${game.length}` : '';
  const sol = game.solution ? ` (${game.solution})` : '';
  const att = game.attempts ? `, coup ${game.attempts}` : '';
  gameLine.innerHTML = `mode actif : <b>${MODE_LABELS[game.mode] || m}</b> — partie ${word} : <b>${game.state}</b>${att}${sol}`;
}

function syncIterationsWithMode() {
  // quotidien : une seule partie par jour, le champ est figé à 1
  if (modeSelect.value === 'daily') { iterationsInput.value = 1; iterationsInput.disabled = true; }
  else { iterationsInput.disabled = false; }
}
modeSelect.addEventListener('change', () => { modeSelect.dataset.touched = '1'; syncIterationsWithMode(); });
strategySelect.addEventListener('change', () => { strategySelect.dataset.touched = '1'; });

function renderBoard() {
  boardEl.innerHTML = '';
  for (const row of rows) {
    const rowEl = document.createElement('div');
    rowEl.className = 'row';
    for (let i = 0; i < wordLength; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.textContent = row.letters[i] || '';
      if (row.pattern) cell.dataset.state = row.pattern[i];
      rowEl.appendChild(cell);
    }
    boardEl.appendChild(rowEl);
  }
}

function addEvent(ev, cls) {
  const div = document.createElement('div');
  div.className = 'event' + (cls ? ' ' + cls : '');
  const time = new Date(ev.timestamp * 1000).toLocaleTimeString();
  div.innerHTML = `<span class="t">${time}</span>${ev.type}: ${JSON.stringify(
    Object.fromEntries(Object.entries(ev).filter(([k]) => !['type', 'timestamp', 'record'].includes(k)))
  )}`;
  eventsEl.prepend(div);
  while (eventsEl.children.length > 200) eventsEl.removeChild(eventsEl.lastChild);
}

function renderLatency(record) {
  latencyBody.innerHTML = '';
  if (!record) return;
  for (const [key, value] of Object.entries(record)) {
    if (!key.startsWith('duration_')) continue;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${key.replace('duration_', '').replace(/_s$/, '')}</td><td>${value}</td>`;
    latencyBody.appendChild(tr);
  }
}

function handleEvent(ev) {
  switch (ev.type) {
    case 'game_started':
      wordLength = ev.length;
      rows = [];
      renderBoard();
      addEvent(ev);
      break;
    case 'guess_proposed':
      rows.push({ letters: ev.guess.split(''), pattern: null });
      renderBoard();
      addEvent(ev);
      break;
    case 'guess_rejected':
      rows.pop(); // le coup n'a pas été retenu par le jeu, on retire la ligne provisoire
      renderBoard();
      renderLatency(ev.record);
      addEvent(ev, 'rejected');
      break;
    case 'feedback_received':
      if (rows.length) rows[rows.length - 1].pattern = ev.pattern;
      renderBoard();
      renderLatency(ev.record);
      addEvent(ev);
      break;
    case 'solved':
      // Statut global ('running'/'idle'/...) piloté par loop_progress/loop_finished
      // /stopped/error, PAS par l'issue d'une partie individuelle — sinon une
      // boucle de N parties s'afficherait comme terminée dès la 1re victoire.
      addEvent(ev, 'solved');
      refreshStats();
      refreshSolutions();
      break;
    case 'not_solved':
    case 'candidates_exhausted':
      addEvent(ev, 'rejected');
      refreshStats();
      break;
    case 'loop_progress':
      loopProgress.textContent = `partie ${ev.current}/${ev.total}`;
      addEvent(ev);
      break;
    case 'loop_finished':
      loopProgress.textContent = `terminé : ${ev.completed}/${ev.total}`;
      addEvent(ev);
      break;
    case 'stopped':
      setStatus('stopped');
      addEvent(ev);
      break;
    case 'error':
      setStatus('error');
      addEvent(ev, 'error');
      break;
    case 'throttled':
      // arrêt d'urgence (429 / Retry-After / latence > 5s), quel que soit le mode —
      // distinct d'une erreur de jeu
      setStatus('throttled');
      addEvent(ev, 'error');
      break;
    case 'daily_limit_reached':
      // mot du jour déjà joué : fin normale, pas une erreur
      setStatus('daily_limit');
      addEvent(ev, 'rejected');
      break;
    case 'mode_refused':
      addEvent(ev, 'error');
      break;
    case 'guess_not_submitted':
      addEvent(ev, 'rejected');
      break;
    default:
      addEvent(ev);
  }
}

function connectWebSocket() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = (msg) => handleEvent(JSON.parse(msg.data));
  ws.onclose = () => setTimeout(connectWebSocket, 1000);
}

async function refreshStatus() {
  const res = await fetch('/api/status');
  const data = await res.json();
  setStatus(data.status);
  if (data.status === 'running') {
    modeSelect.value = data.mode;
    strategySelect.value = data.strategy;
  } else {
    // reflète l'état du serveur sans écraser un choix en cours dans les sélecteurs
    if (!modeSelect.dataset.touched) modeSelect.value = data.mode;
    if (!strategySelect.dataset.touched) strategySelect.value = data.strategy;
  }
  syncIterationsWithMode();
  renderGameLine(data.current_game, data.mode);
  const dailyOpt = modeSelect.querySelector('option[value="daily"]');
  dailyOpt.textContent = 'Quotidien (1 partie / jour)' + (data.daily_played_today ? ' — déjà joué' : '');
  authPill.textContent = 'session : ' + (data.auth_state_present ? 'sauvegardée' : 'anonyme');
  if (data.status === 'running' && data.total_iterations > 1) {
    loopProgress.textContent = `partie ${data.current_iteration}/${data.total_iterations}`;
  }
}

startBtn.addEventListener('click', async () => {
  const iterations = Math.max(1, Number(iterationsInput.value) || 1);
  loopProgress.textContent = '';
  const res = await fetch('/api/start', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ iterations, mode: modeSelect.value, strategy: strategySelect.value }),
  });
  const data = await res.json();
  if (data.started) {
    setStatus('running');
    statsModeSelect.value = data.mode;  // les stats suivent le mode joué
    refreshStats();
    refreshSolutions();
  } else {
    // Refusé : boucle déjà en cours, partie du jour déjà jouée ou mode non
    // automatisé — refléter l'état réel du runner sans prétendre avoir démarré.
    loopProgress.textContent = data.error || 'déjà en cours (voir statut)';
    setStatus(data.status);
  }
});
stopBtn.addEventListener('click', async () => {
  await fetch('/api/stop', { method: 'POST' });
});

// --- délai de saisie ---
const letterDelayMin = document.getElementById('letterDelayMin');
const letterDelayMax = document.getElementById('letterDelayMax');
const applyDelayBtn = document.getElementById('applyDelayBtn');
const delayHint = document.getElementById('delayHint');

async function loadTypingDelay() {
  const res = await fetch('/bot/config/typing_delay');
  const cfg = await res.json();
  letterDelayMin.value = cfg.letter_delay_min_ms;
  letterDelayMax.value = cfg.letter_delay_max_ms;
  delayHint.textContent = `valeur actuelle : ${cfg.letter_delay_min_ms}-${cfg.letter_delay_max_ms}ms/lettre ` +
    `(pris en compte au prochain coup, pas en cours de frappe)`;
}

applyDelayBtn.addEventListener('click', async () => {
  const res = await fetch('/bot/config/typing_delay', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      letter_delay_min_ms: Number(letterDelayMin.value),
      letter_delay_max_ms: Number(letterDelayMax.value),
    }),
  });
  if (res.ok) {
    await loadTypingDelay();
  } else {
    const err = await res.json();
    delayHint.textContent = 'erreur : ' + (err.error || res.statusText);
  }
});

// --- statistiques ---
document.querySelectorAll('.stats-tabs button').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.stats-tabs button').forEach((b) => (b.dataset.active = 'false'));
    document.querySelectorAll('.stats-pane').forEach((p) => (p.dataset.active = 'false'));
    btn.dataset.active = 'true';
    document.querySelector(`.stats-pane[data-pane="${btn.dataset.tab}"]`).dataset.active = 'true';
  });
});

function makeSortableTable(table, rows, columns) {
  table.innerHTML = '';
  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');
  columns.forEach((col, i) => {
    const th = document.createElement('th');
    th.textContent = col.label;
    th.className = 'sortable';
    th.addEventListener('click', () => {
      const dir = th.dataset.dir === 'asc' ? 'desc' : 'asc';
      columns.forEach((c) => delete headRow.children[columns.indexOf(c)].dataset.dir);
      th.dataset.dir = dir;
      rows.sort((a, b) => {
        const va = a[col.key], vb = b[col.key];
        const cmp = typeof va === 'number' ? va - vb : String(va).localeCompare(String(vb));
        return dir === 'asc' ? cmp : -cmp;
      });
      renderBody();
    });
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);
  const tbody = document.createElement('tbody');
  table.appendChild(tbody);

  function renderBody() {
    tbody.innerHTML = '';
    for (const row of rows) {
      const tr = document.createElement('tr');
      tr.innerHTML = columns.map((c) => `<td>${row[c.key] ?? ''}</td>`).join('');
      tbody.appendChild(tr);
    }
  }
  renderBody();
}

function renderOverallStats(overall) {
  const tbody = document.querySelector('#overallStatsTable tbody');
  tbody.innerHTML = '';
  const rows = [
    ['Parties jouées', overall.total],
    ['Résolues', overall.solved],
    ['Taux de résolution', overall.resolution_rate_pct != null ? overall.resolution_rate_pct + '%' : '—'],
    ...Object.entries(overall.histogram_pct || {}).map(([k, v]) => [k, v + '%']),
  ];
  for (const [label, value] of rows) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${label}</td><td>${value}</td>`;
    tbody.appendChild(tr);
  }
}

async function refreshStats() {
  const res = await fetch('/bot/stats?mode=' + statsModeSelect.value);
  const stats = await res.json();
  const counts = Object.entries(stats.games_by_mode || {})
    .map(([m, n]) => `${MODE_LABELS[m] || m} : ${n}`).join(' · ');
  document.getElementById('statsModeHint').textContent = counts ? `parties enregistrées — ${counts}` : '';
  renderOverallStats(stats.overall);
  makeSortableTable(document.getElementById('byLengthStatsTable'), stats.by_length, [
    { key: 'length_range', label: 'Longueur' },
    { key: 'total', label: 'Parties' },
    { key: 'resolution_rate_pct', label: 'Taux résolution %' },
  ]);
  makeSortableTable(document.getElementById('byLetterStatsTable'), stats.by_letter, [
    { key: 'letter', label: 'Lettre' },
    { key: 'total', label: 'Parties' },
    { key: 'resolution_rate_pct', label: 'Taux résolution %' },
  ]);
  makeSortableTable(
    document.getElementById('failedStatsTable'),
    stats.failed_games.map((g) => ({ ...g, guesses_attempted: (g.guesses_attempted || []).join(', ') })),
    [
      { key: 'letter', label: 'Lettre' },
      { key: 'length', label: 'Longueur' },
      { key: 'attempts', label: 'Coups' },
      { key: 'outcome', label: 'Issue' },
      { key: 'guesses_attempted', label: 'Mots joués' },
    ]
  );
}

async function refreshSolutions() {
  const res = await fetch('/bot/stats/solutions?mode=' + statsModeSelect.value);
  const data = await res.json();
  const hint = document.getElementById('solutionsHint');
  hint.textContent = `${data.n_solutions_recorded} solution(s) enregistrée(s), ` +
    `${data.n_distinct_solutions} distincte(s)` +
    (data.has_observed_repeats
      ? ` — au moins un mot déjà vu plusieurs fois (voir tableau ci-dessous).`
      : ` — aucune répétition observée pour l'instant (échantillon peut-être encore trop petit).`);

  makeSortableTable(document.getElementById('solutionsByLengthTable'), data.length_distribution, [
    { key: 'length', label: 'Longueur' },
    { key: 'count', label: 'Occurrences' },
    { key: 'pct', label: '%' },
  ]);
  makeSortableTable(document.getElementById('solutionsByLetterTable'), data.letter_distribution, [
    { key: 'letter', label: 'Lettre' },
    { key: 'count', label: 'Occurrences' },
    { key: 'pct', label: '%' },
  ]);
  makeSortableTable(document.getElementById('solutionsRepeatedTable'), data.repeated_solutions, [
    { key: 'word', label: 'Mot' },
    { key: 'count', label: 'Nb de fois vu' },
  ]);
}

statsModeSelect.addEventListener('change', () => { refreshStats(); refreshSolutions(); });

connectWebSocket();
refreshStatus();
loadTypingDelay();
refreshStats();
refreshSolutions();
setInterval(refreshStatus, 5000);
</script>
</body>
</html>
